name: fetch-gse237895
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-gse237895.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download GSE237895 RAW tar
        run: |
          set -euo pipefail
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          URL_HTTPS="https://ftp.ncbi.nlm.nih.gov/geo/series/GSE237nnn/GSE237895/suppl/GSE237895_RAW.tar"
          URL_CGI="https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSE237895&format=file"
          URL_FTP="ftp://ftp.ncbi.nlm.nih.gov/geo/series/GSE237nnn/GSE237895/suppl/GSE237895_RAW.tar"
          ok=0
          for U in "$URL_HTTPS" "$URL_CGI" "$URL_FTP"; do
            echo "Trying: $U"
            rm -f out/GSE237895_RAW.tar
            if curl -fL -A "$UA" --retry 4 --retry-delay 3 --connect-timeout 20 -o out/GSE237895_RAW.tar "$U"; then
              if tar -tf out/GSE237895_RAW.tar >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "All curl attempts failed, trying ftp wget..."
            rm -f out/GSE237895_RAW.tar
            wget -U "$UA" -O out/GSE237895_RAW.tar "$URL_FTP"
            tar -tf out/GSE237895_RAW.tar >/dev/null
          fi
          ls -lh out/GSE237895_RAW.tar
          (cd out && sha256sum GSE237895_RAW.tar > SHA256SUMS_gse237895)
          cat out/SHA256SUMS_gse237895
      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete gse237895-v1 --yes --cleanup-tag || true
          gh release create gse237895-v1 \
            --title "GSE237895 relay" \
            --notes "Temporary relay of public GEO supplementary file GSE237895_RAW.tar (public data)."
          gh release upload gse237895-v1 out/GSE237895_RAW.tar out/SHA256SUMS_gse237895 --clobber
